<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>Site Blocked</title>
  <link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet">
  <style>
    body, html { margin:0; height:100%; font-family: 'Roboto', sans-serif; background:#f44336; color:#fff; display:flex; align-items:center; justify-content:center; }
    .card { background:#fff; color:#000; padding:24px; border-radius:12px; box-shadow:0 4px 12px rgba(0,0,0,.3); text-align:center; max-width:320px; }
    h1 { margin:0 0 8px; color:#d32f2f; }
    p { margin:12px 0; }
    a { color:#1976d2; text-decoration:none; font-weight:500; }
    .icon { font-size:48px; color:#d32f2f; margin-bottom:8px; }
  </style>
</head>
<body>
  <div class="card">
    <div class="icon material-icons">block</div>
    <h1>Access Blocked</h1>
    <p>This site is blocked by <strong>Material Site Blocker</strong>.</p>
    <p><a href="javascript:history.back()">Go Back</a></p>
  </div>
</body>
</html>
